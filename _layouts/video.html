---
layout: single
---
<style>
  .video-detail .video-detail-player {
    width: 100%;
    aspect-ratio: 504 / 399;
  }

  .video-detail iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .video-detail .video-detail-links {
    margin-top: 1em;
  }
</style>

<div class="video-detail">
  <div class="video-detail-description">
    {{ content }}
  </div>
  <div class="video-detail-player">
    <iframe src="{{ page.video_embed_url | escape }}" width="504" height="399" loading="lazy" title="{{ page.title | escape }}" allowfullscreen></iframe>
  </div>
  <p class="video-detail-links">Video duration: {{ page.video_duration | escape }} · <a href="{{ page.video_original_url | escape }}">Watch the original on LinkedIn</a></p>
  <p><a href="{{ '/' | relative_url }}#profile-videos">Back to all videos</a></p>
</div>
