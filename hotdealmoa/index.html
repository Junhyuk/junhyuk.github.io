<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>핫딜모아</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin:0; background:linear-gradient(180deg,#eef4ff,#f7f8fc); color:#111827; }
    .wrap { max-width: 960px; margin:0 auto; padding:48px 20px 80px; }
    .hero { background:#fff; border-radius:28px; padding:36px; box-shadow:0 14px 40px rgba(0,0,0,.08); }
    h1 { font-size:2.4rem; margin:0 0 12px; }
    p, li { line-height:1.8; }
    .btns { display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }
    a.btn { background:#157efb; color:#fff; text-decoration:none; padding:12px 18px; border-radius:14px; font-weight:700; }
    a.btn.secondary { background:#eef2ff; color:#374151; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-top:24px; }
    .card { background:#fff; border-radius:20px; padding:24px; box-shadow:0 10px 24px rgba(0,0,0,.06); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>핫딜모아</h1>
      <p>뽐뿌, 퀘이사존, 알뜰구매 등 여러 게시판의 할인 정보와 인기 글을 한 번에 확인할 수 있는 핫딜 모음 앱입니다.</p>
      <div class="btns">
        <a class="btn" href="./support/">지원 페이지</a>
        <a class="btn secondary" href="./privacy/">개인정보처리방침</a>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>주요 기능</h3>
        <ul>
          <li>카테고리별 핫딜 모아보기</li>
          <li>최신순/인기순 정렬</li>
          <li>상품 상세 및 외부 링크 연결</li>
          <li>댓글 미리보기와 웹뷰 설정</li>
        </ul>
      </div>
      <div class="card">
        <h3>이용 안내</h3>
        <p>앱의 할인 정보는 외부 원문과 쇼핑몰 정보를 바탕으로 표시됩니다. 가격, 재고, 배송비, 종료 여부는 수시로 변경될 수 있으므로 구매 전에 반드시 원문과 판매처 정보를 확인해 주세요.</p>
      </div>
    </div>
  </div>
</body>
</html>
